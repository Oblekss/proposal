<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menyu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #fce5ec, #f48fb1, #f06292);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Hearts background ── */
  .hearts-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .heart-particle {
    position: absolute;
    bottom: -60px;
    font-size: 1.4rem;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* ── Screens ── */
  .screen { display: none; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ── Screen 0: envelope ── */
  #screen0 { text-align: center; }
  .envelope-wrap {
    animation: bob 2s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-18px); }
  }
  .envelope {
    width: 220px; height: 150px;
    background: #e91e63;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(233,30,99,.45);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: transform .15s;
  }
  .envelope:hover { transform: scale(1.05); }
  .envelope::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 50%;
    background: #c2185b;
    clip-path: polygon(0 0, 50% 55%, 100% 0);
    border-radius: 16px 16px 0 0;
  }
  .envelope-label {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.2);
    margin-top: 8px;
    letter-spacing: .04em;
  }
  .tap-hint {
    margin-top: 18px; font-size: .9rem; color: rgba(255,255,255,.75);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* ── Screen 1: question ── */
  #screen1 { width: 100%; padding: 20px; }
  .card {
    background: #fff;
    border-radius: 28px;
    padding: 48px 44px;
    box-shadow: 0 20px 60px rgba(233,30,99,.25);
    text-align: center;
    max-width: 480px;
    width: 100%;
    animation: cardIn .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cardIn {
    from { transform: scale(.7); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }
  .question {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 2rem);
    color: #333;
    margin-bottom: 36px;
    line-height: 1.35;
  }
  .btn-row {
    display: flex; gap: 20px; justify-content: center; align-items: center;
    position: relative; overflow: visible;
  }

  .btn-yes {
    background: #e91e63;
    color: #fff;
    border: none;
    padding: 16px 36px;
    border-radius: 14px;
    font-size: 1.2rem;
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(233,30,99,.4);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  }
  .btn-yes:hover {
    box-shadow: 0 10px 30px rgba(233,30,99,.5);
  }

  .btn-no {
    background: #9e9e9e;
    color: #fff;
    border: none;
    padding: 16px 36px;
    border-radius: 14px;
    font-size: 1.2rem;
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    transition: transform .25s ease, opacity .25s ease, font-size .25s ease;
  }

  /* ── Screen 2: yes! ── */
  #screen2 {
    min-height: 100vh; width: 100%;
    background: linear-gradient(135deg, #fce4ec, #f8bbd0);
    text-align: center; padding: 40px;
  }
  .yes-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    color: #c2185b;
    margin-bottom: 16px;
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1);
  }
  .yes-sub {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: #555;
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) .15s both;
  }
  @keyframes popIn {
    from { transform: scale(.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* ── Confetti ── */
  #confetti-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
  }

  .biwik-img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #f48fb1;
    box-shadow: 0 8px 24px rgba(233,30,99,.3);
    margin: 16px auto 28px;
    display: block;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
  }
  .biwik2-img {
    margin-top: 28px;
    width: 200px;
    height: 200px;
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) .2s both;
  }

  .tenor-wrap {
    margin-top: 28px;
    width: min(280px, 80vw);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(233,30,99,.3);
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) .2s both;
  }
  .biwik2-img { display: none; }

  /* Hide Tenor hover overlay */
  .tenor-gif-embed > a,
  .tenor-gif-embed .tenor-share-button,
  .tenor-gif-embed [class*="share"],
  .tenor-gif-embed [class*="overlay"],
  .tenor-gif-embed [class*="info"],
  .tenor-gif-embed iframe + * { display: none !important; }
  .tenor-wrap * { pointer-events: none; }
</style>
</head>
<body>

<!-- floating hearts -->
<div class="hearts-bg" id="heartsLayer"></div>

<!-- Canvas for confetti -->
<canvas id="confetti-canvas"></canvas>

<!-- Audio -->
<audio id="bgmusic" loop>
  <source src="lovers-rock.mp3" type="audio/mpeg" />
</audio>

<!-- Screen 0 -->
<div class="screen active" id="screen0">
  <div class="envelope-wrap" onclick="goToScreen1()">
    <div class="envelope">💌</div>
    <div class="envelope-label">Open me</div>
  </div>
  <p class="tap-hint">tap to open ✨</p>
</div>

<!-- Screen 1 -->

<div class="screen" id="screen2">
  <h1 class="yes-title">You said yes! 💖</h1>
  <p class="yes-sub">I'll be your balawka forever. ❤️</p>

  <div class="tenor-wrap">

<script>
  // ── Floating hearts ──
  const heartsLayer = document.getElementById('heartsLayer');
  const EMOJIS = ['💖','💕','💗','💓','🩷','❤️','💝'];
  for (let i = 0; i < 18; i++) {
    const h = document.createElement('span');
    h.className = 'heart-particle';
    h.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
    const dur = 6 + Math.random() * 8;
    h.style.animationDuration = dur + 's';
    h.style.animationDelay = (-Math.random() * dur) + 's';
    heartsLayer.appendChild(h);
  }

  // ── Screen transitions ──
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function goToScreen1() {
    show('screen1');
    document.getElementById('bgmusic').play().catch(() => {});
  }

  function goToScreen2() {
    show('screen2');
    startConfetti();
  }

  // ── Dodging "No" button ──
  let noCount = 0;
  const btnNo  = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');

  function dodgeNo() {
    noCount++;
    // Move No button to a random offset
    const x = (Math.random() * 250 - 125);
    const y = (Math.random() * 250 - 125);
    btnNo.style.transform = `translate(${x}px, ${y}px) scale(${Math.max(0.3, 1 - noCount * 0.1)})`;
    btnNo.style.opacity = Math.max(0.2, 1 - noCount * 0.08);
    // Grow Yes button
    btnYes.style.transform = `scale(${1 + noCount * 0.15})`;
  }

  // ── Confetti ──
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  let pieces   = [];
  let animId   = null;

  function startConfetti() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    pieces = Array.from({ length: 160 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: 8 + Math.random() * 8,
      h: 4 + Math.random() * 6,
      color: ['#e91e63','#f06292','#f48fb1','#ff80ab','#ff4081','#fff','#ffcdd2'][Math.floor(Math.random()*7)],
      speed: 2 + Math.random() * 4,
      angle: Math.random() * Math.PI * 2,
      spin:  (Math.random() - .5) * .15,
      drift: (Math.random() - .5) * 1.5,
    }));
    if (animId) cancelAnimationFrame(animId);
    drawConfetti();
  }

  function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    pieces.forEach(p => {
      p.y     += p.speed;
      p.x     += p.drift;
      p.angle += p.spin;
      if (p.y < canvas.height + 20) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (alive) animId = requestAnimationFrame(drawConfetti);
  }

  window.addEventListener('resize', () => {
    if (document.getElementById('screen2').classList.contains('active')) {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
  });
</script>
